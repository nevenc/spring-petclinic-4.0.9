plugins {
  id 'java'
  id 'jacoco'
  id 'org.springframework.boot' version '4.0.9'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'io.spring.javaformat' version '0.0.48'
  id 'io.spring.nohttp' version '0.0.11'
  id 'com.gorylenko.gradle-git-properties' version '4.0.1'
}

group = 'org.springframework.samples'
version = '4.0.9'
description = 'petclinic'

java {
  sourceCompatibility = JavaVersion.VERSION_25
  targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
  options.encoding = 'UTF-8'
}

repositories {
  mavenCentral()
  maven {
    name = 'spring-snapshots'
    url = 'https://repo.spring.io/snapshot'
    mavenContent { snapshotsOnly() }
  }
  maven {
    name = 'spring-milestones'
    url = 'https://repo.spring.io/milestone'
    mavenContent { releasesOnly() }
  }
}

ext.webjarsBootstrapVersion = '5.1.3'
ext.webjarsFontawesomeVersion = '4.7.0'
ext.jacocoVersion = '0.8.16'
ext.checkstyleVersion = '8.45.1'

// Mirrors <dependencyManagement> in pom.xml (overrides Spring Boot BOM versions)
dependencyManagement {
  dependencies {
    dependencySet(group: 'com.fasterxml.jackson.core', version: '2.21.8') {
      entry 'jackson-core'
      entry 'jackson-databind'
    }
    dependency 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.21.8'
    dependency 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.8'
    dependency 'com.fasterxml.jackson.module:jackson-module-parameter-names:2.21.8'
    dependency 'net.minidev:json-smart:2.6.1'
    dependency 'org.aspectj:aspectjweaver:1.9.27'
    dependency 'org.hibernate.validator:hibernate-validator:9.0.3.Final'
    dependencySet(group: 'org.thymeleaf', version: '3.1.6.RELEASE') {
      entry 'thymeleaf'
      entry 'thymeleaf-spring6'
    }
  }
}

dependencies {
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api'
  // Spring and Spring Boot dependencies
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-cloudfoundry'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation('org.springframework.boot:spring-boot-starter-webmvc') {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jackson'
  }
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation('org.springframework.boot:spring-boot-starter-webmvc-test') {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jackson'
  }

  // Databases - Uses H2 by default
  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'org.postgresql:postgresql'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  testImplementation('org.springframework.boot:spring-boot-starter-restclient') {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jackson'
  }

  // caching
  implementation 'javax.cache:cache-api'
  implementation('org.ehcache:ehcache') {
    artifact {
      classifier = 'jakarta'
    }
  }

  // webjars
  implementation "org.webjars.npm:bootstrap:${webjarsBootstrapVersion}"
  implementation "org.webjars.npm:font-awesome:${webjarsFontawesomeVersion}"

  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  implementation 'org.springframework.boot:spring-boot-jackson2'
}

tasks.named('test') {
  useJUnitPlatform()
  finalizedBy 'jacocoTestReport'
}

// Spring Boot Actuator displays build-related information
// if a META-INF/build-info.properties file is present
springBoot {
  buildInfo {
    properties {
      additional = [
        'encoding.source'   : 'UTF-8',
        'encoding.reporting': 'UTF-8',
        'java.source'       : java.sourceCompatibility.toString(),
        'java.target'       : java.targetCompatibility.toString()
      ]
    }
  }
}

// Spring Boot Actuator displays git information if a git.properties
// file is present on the classpath
gitProperties {
  dateFormat = "yyyy-MM-dd'T'HH:mm:ssZ"
  failOnNoGitDirectory = false
}

jacoco {
  toolVersion = jacocoVersion
}

// Only the nohttp check is used, as in the Maven build
checkstyle {
  toolVersion = checkstyleVersion
  configDirectory = file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}

tasks.named('checkstyleMain') { enabled = false }
tasks.named('checkstyleTest') { enabled = false }

// Mirrors the excludes in pom.xml and src/checkstyle/nohttp-checkstyle-suppressions.xml
nohttp {
  source.exclude 'target/**', 'bin/**', '.gradle/**', '.idea/**', '**/*.class',
    '**/node_modules/**', '**/node/**', '**/build.log',
    '**/*.jar', '**/*.git', '**/*.ico', '**/*.p12', '**/*.gif', '**/*.jks', '**/*.jpg', '**/*.svg'
}

checkstyleNohttp {
  configDirectory = file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}
